name: Release (macOS arm64 + x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (example: v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  build-macos:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64

    steps:
      - name: Checkout tag source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './app -> target'

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: app

      - name: Assemble app bundle
        run: |
          bundle="$(bash scripts/bundle-app.sh release ${{ matrix.target }})"
          echo "APP_PATH=$bundle" >> "$GITHUB_ENV"
          echo "Using bundle: $bundle"

      - name: Ad-hoc sign app bundle
        run: |
          codesign --force --deep --sign - "${APP_PATH}"
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          rm -f release-assets/*

          APP_NAME="$(basename "${APP_PATH}" .app)"
          VERSION="${TAG_NAME#v}"
          RELEASE_BASENAME="ClaudeSessionSwitch"
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            ARCH_SUFFIX="arm64"
          else
            ARCH_SUFFIX="x64"
          fi
          DMG_NAME="${RELEASE_BASENAME}_${VERSION}_${ARCH_SUFFIX}.dmg"
          DMG_PATH="release-assets/${DMG_NAME}"

          DMG_STAGING_DIR="$(mktemp -d)"
          cp -R "${APP_PATH}" "${DMG_STAGING_DIR}/"
          ln -s /Applications "${DMG_STAGING_DIR}/Applications"

          rm -f "${DMG_PATH}"
          for ATTEMPT in 1 2 3; do
            echo "Creating DMG (attempt ${ATTEMPT}): ${DMG_PATH}"
            if hdiutil create -volname "${APP_NAME}" -srcfolder "${DMG_STAGING_DIR}" -ov -format UDZO "${DMG_PATH}"; then
              break
            fi
            hdiutil detach "/Volumes/${APP_NAME}" -force || true
            rm -f "${DMG_PATH}"
            sleep 2
          done

          if [ ! -f "${DMG_PATH}" ]; then
            echo "Failed to create DMG after retries: ${DMG_PATH}"
            exit 1
          fi

          rm -rf "${DMG_STAGING_DIR}"
          ls -lah release-assets

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-macos

    steps:
      - name: Checkout tag source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}
          fetch-depth: 0

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-arm64
          path: release-assets/arm64

      - name: Download x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-x64
          path: release-assets/x64

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          find . -name '*.dmg' -exec cp {} . \;
          sha256sum *.dmg > SHA256SUMS
          echo "SHA256SUMS contents:"
          cat SHA256SUMS

      - name: Generate release notes
        run: |
          chmod +x scripts/generate-release-notes.sh
          scripts/generate-release-notes.sh "${TAG_NAME}" > release-assets/RELEASE_NOTES.md
          echo "Release notes contents:"
          cat release-assets/RELEASE_NOTES.md

      - name: Create release with auto notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body_path: release-assets/RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/arm64/*.dmg
            release-assets/x64/*.dmg
            release-assets/SHA256SUMS
